[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example"
version = "0.0.1"
description = "An awesome pipeline"
authors = [
    {name = "Author", email = "author@example.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pipen>=1.1,<1.2",
    "pipen-filters>=1.1,<1.2",
    "pipen-verbose>=1.1,<1.2",
    "pipen-args>=1.2,<1.3",
"pipen-report>=1.2,<1.3",
    ]

[project.scripts]
example = "example.main:main"


[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
